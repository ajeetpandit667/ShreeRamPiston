
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs - Shree Ram Piston</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'repairs/theme.css' %}">
  <style>body { display: flex; flex-direction: column; min-height: 100vh; }</style>
</head>
<body>
  <!-- Navigation Bar (standardized) -->
  <nav>
    <div class="container flex-between" style="max-width: 1200px; margin: 0 auto; padding: 0 1.5rem;">
      <div style="font-size: 1.25rem; font-weight: 700;">Shree Ram Piston</div>
      <div style="display: flex; gap: 2rem;">
        <a href="{% url 'repairs:home' %}">Home</a>
        <a href="{% url 'repairs:job_list' %}">Jobs</a>
      </div>
    </div>
  </nav>
  <main style="flex: 1;">
    <div class="container" style="padding: 2rem 1.5rem;">
      <div class="card">
      <h1 style="text-align: center; margin-bottom: 2rem;">Recent Jobs</h1>
      <div style="border-collapse: collapse; width: 100%;">
        {% for j in jobs %}
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #e5e7eb;">
          <div>
            <a href="{% url 'repairs:job_detail' j.job_id %}" style="font-weight: 600;">{{ j.job_id }}</a>
            <span style="margin-left: 1rem; color: #6b7280;">{{ j.customer.phone }}</span>
            <span class="badge badge-primary" style="margin-left: 1rem;">{{ j.status }}</span>
          </div>
        </div>
        {% empty %}
        <div style="padding: 1rem; text-align: center; color: #6b7280;">No jobs</div>
        {% endfor %}
      </div>
      <div style="margin-top: 2rem; text-align: center;">
        <a href="{% url 'repairs:home' %}" class="btn-primary">Create new request</a>
      </div>
      </div>
    </div>
  </main>
  <!-- Footer (standardized) -->
  <footer>
    <p>© 2025 Shree Ram Piston. All rights reserved.</p>
  </footer>
</body>
</html>
