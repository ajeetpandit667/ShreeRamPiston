<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs - Shree Ram Piston</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'repairs/theme.css' %}">
  <style>
      body { display: flex; flex-direction: column; min-height: 100vh; }
      .job-row:hover { background: #f9fafb; cursor: pointer; }
  </style>
</head>

<body>

<!-- NAV -->
<nav>
    <div class="container flex-between" style="max-width:1200px; margin:0 auto; padding:0 1.5rem;">
        <div style="font-size:1.25rem; font-weight:700;">Shree Ram Piston</div>
        <div style="display:flex; gap:2rem;">
            <a href="{% url 'repairs:home' %}">Home</a>
            <a href="{% url 'repairs:job_list' %}">Jobs</a>
        </div>
    </div>
</nav>

<main style="flex:1;">
    <div class="container" style="padding:2rem 1.5rem;">
        <div class="card">

            <h1 style="text-align:center; margin-bottom:2rem;">Recent Jobs</h1>

            <!-- SEARCH BAR -->
            <form method="GET" style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
                <input type="text" name="job_id" value="{{ request.GET.job_id }}"
                       placeholder="Search Job ID"
                       style="padding:0.5rem 1rem; border:1px solid #d1d5db; border-radius:8px;">

                <input type="text" name="phone" value="{{ request.GET.phone }}"
                       placeholder="Search Phone"
                       style="padding:0.5rem 1rem; border:1px solid #d1d5db; border-radius:8px;">

                <button class="btn-primary" type="submit">Search</button>
            </form>

            <!-- JOB LIST -->
            <div style="border-collapse:collapse; width:100%;">
                {% for j in jobs %}
                <div class="job-row"
                     style="display:flex; justify-content:space-between; align-items:center; padding:1rem 0; border-bottom:1px solid #e5e7eb;"
                     onclick="window.location='{% url 'repairs:job_detail' j.job_id %}'">

                    <div>
                        <span style="font-weight:600;">{{ j.job_id }}</span>

                        <span style="margin-left:1rem; color:#6b7280;">
                            {{ j.customer.phone }}
                        </span>

                        <span style="margin-left:1rem; color:#4b5563;">
                            {{ j.item_name }}
                        </span>

                        <!-- Dynamic Status Badge -->
                        <span class="badge 
                            {% if j.status == 'open' %} badge-warning
                            {% elif j.status == 'dispatched' %} badge-warning
                            {% elif j.status == 'received' %} badge-primary
                            {% elif j.status == 'repairing' %} badge-secondary
                            {% elif j.status == 'ready' %} badge-success
                            {% elif j.status == 'not_repairable' %} badge-danger
                            {% elif j.status == 'dispatched_back' %} badge-info
                            {% elif j.status == 'closed' %} badge-secondary
                            {% endif %}"
                            style="margin-left:1rem;">
                            {{ j.status }}
                        </span>
                    </div>

                </div>
                {% empty %}
                <div style="padding:1rem; text-align:center; color:#6b7280;">No jobs found</div>
                {% endfor %}
            </div>

            <div style="margin-top:2rem; text-align:center;">
                <a href="{% url 'repairs:home' %}" class="btn-primary">Create New Repair Request</a>
            </div>

        </div>
    </div>
</main>

<!-- FOOTER -->
<footer>
    <p>© 2025 Shree Ram Piston. All rights reserved.</p>
</footer>

</body>
</html>
