<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Ram Piston - Repair Service</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'repairs/theme.css' %}">
</head>

<body style="display:flex; flex-direction:column; min-height:100vh;">

<!-- Navigation Bar -->
<nav>
    <div class="container flex-between" style="max-width:1200px; margin:0 auto; padding:0 1.5rem;">
        <div style="font-size:1.25rem; font-weight:700;">Shree Ram Piston</div>
        <div style="display:flex; gap:2rem;">
            <a href="{% url 'repairs:home' %}">Home</a>
            <a href="{% url 'repairs:job_list' %}">Jobs</a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container" style="padding:2rem 1.5rem; flex:1;">
    <div class="card">

        <h2 style="text-align:center; margin-bottom:2rem;">
            Create Repair Request
        </h2>

        <!-- Smart Warehouse Recommendation Card -->
        <div class="card" style="margin-bottom:1.5rem; background:#ffffffaa; border-left:6px solid #10b981;">
            <h3 style="margin-bottom:0.75rem;">📦 Smart Warehouse Recommendation</h3>

            <div id="warehouseSuggestion" class="info-box">
                <em>Analyzing warehouse workload...</em>
            </div>
        </div>

        <script>
        fetch("{% url 'repairs:best_warehouse' %}")
            .then(response => response.json())
            .then(data => {
                let html = `
                    <div style="display:flex; align-items:center; gap:1rem;">
                        <div style="font-size:2.5rem;">📊</div>
                        <div>
                            <b>Recommended Warehouse:</b> 
                            <span style="color:#0ea5e9; font-size:1.25rem;">${data.warehouse}</span><br>
                            <small>(Current Load: ${data.load} active jobs)</small>
                        </div>
                    </div>
                `;

                document.getElementById("warehouseSuggestion").innerHTML = html;
            })
            .catch(() => {
                document.getElementById("warehouseSuggestion").innerHTML =
                    "⚠️ Unable to load recommendation.";
            });
        </script>

        <!-- Request Form -->
        <form id="reqForm" style="display:grid; gap:1rem; max-width:450px; margin:auto;">
            {% csrf_token %}

            <div class="form-group">
                <input type="text" name="customer_name" placeholder="Customer Name" required>
            </div>

            <div class="form-group">
                <input type="text" name="phone" placeholder="Phone Number" required>
            </div>

            <div class="form-group">
                <input type="email" name="email" placeholder="Email (optional)">
            </div>

            <div class="form-group">
                <!-- FIXED: item → item_name -->
                <input type="text" name="item_name" placeholder="Item Name" required>
            </div>

            <div class="form-group">
                <!-- FIXED: reason → damage_reason -->
                <textarea name="damage_reason" placeholder="Damage Reason" style="height:6rem;"></textarea>
            </div>

            <div class="form-group">
                <!-- FIXED: days → repair_days -->
                <input type="number" name="repair_days" placeholder="Repair Days" value="2">
            </div>

            <div class="form-group">
                <select name="store" required>
                    {% for s in stores %}
                    <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn-primary" style="width:100%;">Request OTP</button>
        </form>

        <!-- OTP UI -->
        <div id="otpDiv" style="display:none; margin-top:2rem; max-width:450px; margin:auto;">
            <div class="form-group">
                <input type="text" id="otp" placeholder="Enter OTP">
            </div>
            <button id="verifyBtn" class="btn-success" style="width:100%;">Verify OTP</button>
        </div>

    </div>
</div>

<!-- Footer -->
<footer>
    <p>© 2025 Shree Ram Piston. All rights reserved.</p>
</footer>


<script>
// Get csrftoken
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.slice(name.length + 1));
            }
        }
    }
    return cookieValue;
}
const csrftoken = getCookie("csrftoken");


// Handle Request OTP
const form = document.getElementById("reqForm");
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = new FormData(form);

    const res = await fetch("{% url 'repairs:request_otp' %}", {
        method: "POST",
        headers: { "X-CSRFToken": csrftoken },
        body: data,
        credentials: "same-origin",
    });

    const json = await res.json();

    if (json.success) {
        alert("OTP sent successfully!");
        localStorage.setItem("temp_id", json.temp_id);

        form.style.display = "none";       // hide form
        document.getElementById("otpDiv").style.display = "block"; // show OTP UI

    } else {
        alert(json.error);
    }
});


// Handle Verify OTP
document.getElementById("verifyBtn").addEventListener("click", async () => {
    const otp = document.getElementById("otp").value;

    const fd = new FormData();
    fd.append("temp_id", localStorage.getItem("temp_id"));
    fd.append("otp", otp);

    const res = await fetch("{% url 'repairs:verify_otp' %}", {
        method: "POST",
        headers: { "X-CSRFToken": csrftoken },
        body: fd,
        credentials: "same-origin",
    });

    const json = await res.json();

    if (json.success) {
        alert("Job Created Successfully!");

        // Redirect to job detail (use the jobs URL pattern)
        window.location.href = "/jobs/" + json.job_id + "/";

    } else {
        alert(json.error);
    }
});
</script>

<!-- Footer -->
<footer style="padding:1rem 0; text-align:center; background:transparent;">
    <p style="margin:0; color:#6b7280;">© 2025 Shree Ram Piston. All rights reserved.</p>
</footer>

</body>
</html>
