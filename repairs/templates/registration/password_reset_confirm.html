{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Set a new password</title>
  <link rel="stylesheet" href="{% static 'repairs/css/auth.css' %}">
</head>
<body>
  <div class="auth-container">
    <h2>Set a new password</h2>

    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn">Change password</button>
      </form>
    {% else %}
      <p>Sorry, the reset link is invalid. Please request a new one.</p>
      <p><a href="{% url 'password_reset' %}">Request a new password reset</a></p>
    {% endif %}
  </div>
</body>
</html>
