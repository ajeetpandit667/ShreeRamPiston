{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Set a new password</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'repairs/theme.css' %}">
  <style>body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }</style>
</head>
<body>
  <div class="card" style="max-width: 400px; width: 100%; margin: 2rem;">
    <h2>Set a new password</h2>

    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        <div style="display: grid; gap: 1.5rem;">
          {{ form.as_p }}
          <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Change password</button>
        </div>
      </form>
    {% else %}
      <div class="error-box">
        <p>Sorry, the reset link is invalid. Please request a new one.</p>
      </div>
      <p style="text-align: center;"><a href="{% url 'password_reset' %}" class="btn-primary" style="display: inline-block; margin-top: 1rem;">Request a new password reset</a></p>
    {% endif %}
  </div>
</body>
</html>
