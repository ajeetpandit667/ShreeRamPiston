{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Shree Ram Piston</title>
    <link rel="stylesheet" href="{% static 'repairs/theme.css' %}">
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="container flex-between" style="max-width: 1200px; margin: 0 auto; padding: 0 1.5rem;">
        <div style="font-size: 1.25rem; font-weight: 700;">Shree Ram Piston</div>
        <div style="display: flex; gap: 2rem;">
            <a href="{% url 'login' %}">Login</a>
        </div>
    </div>
</nav>

<!-- Main Section -->
<div class="container" style="padding: 2rem 1.5rem; display: flex; justify-content: center;">
    <div class="card" style="max-width: 420px; width: 100%;">

        <h2 style="text-align: center; margin-bottom: 1.5rem;">Set a New Password</h2>

        {% if validlink %}

            <form method="post" style="display: grid; gap: 1.2rem;">
                {% csrf_token %}
                
                <!-- Django form fields (already styled by theme.css) -->
                {{ form.as_p }}

                <button type="submit" class="btn-primary" style="width: 100%;">
                    Change Password
                </button>
            </form>

        {% else %}

            <div class="error-box" style="margin-bottom: 1.5rem;">
                <p>The password reset link is invalid or expired.</p>
            </div>

            <a href="{% url 'password_reset' %}" class="btn-primary" 
               style="display: block; width: 100%; text-align: center;">
                Request New Reset Link
            </a>

        {% endif %}
    </div>
</div>

<!-- Footer -->
<footer>
    <p>© 2025 Shree Ram Piston. All rights reserved.</p>
</footer>

</body>
</html>
